// LDLib2 in-client UI test harness: Gradle wiring for ModDevGradle.
//
// Ported from LDLib2's gradle/ldlib2-uitest.gradle (LGPL-3.0, published for copying), which
// targets NeoGradle's top-level `runs`; ModDevGradle keeps its runs under `neoForge.runs`.
// The headless block is not ported. Inert unless -PldTest is given.
//
//   gradlew runClient -PldTest=group:duelcraft          every duelcraft scenario
//   gradlew runClient -PldTest=duel_mr5_scale3           one by name
//   gradlew runClient -PldTest=duel_mr5_scale3 -PldTestKeepOpen
//   -> build/ldlib2-uitest/report.json, report.txt, screenshots/
//
// Docs: ../LDLib2/uitest.md

def ldTestOutDir = layout.buildDirectory.dir('ldlib2-uitest').get().asFile.absolutePath
def ldTestOutDirFile = file(ldTestOutDir)

// Captured once at configuration time: the two onlyIf { } closures below run at task-execution
// time, and under the configuration cache a closure cannot call project.hasProperty(...) there
// (it would need a live Project). A plain boolean local serializes fine.
def ldTestEnabled = project.hasProperty('ldTest')

if (project.hasProperty('collectionTransferLifecycle')) {
    def phase = project.property('collectionTransferLifecycle').toString()
    if (!(phase in ['seed', 'verify']) || ldTestEnabled || project.hasProperty('collectionLifecycle') || project.hasProperty('collectionPolicyLifecycle')) {
        throw new GradleException('collectionTransferLifecycle requires seed|verify alone')
    }
    def transferDir = project.file('run-collection-transfer-lifecycle')
    neoForge.runs.matching { it.name == 'client' }.configureEach { run ->
        run.gameDirectory = transferDir
        run.systemProperty 'duelcraft.uitest.collectionTransferLifecycle', phase
        run.programArguments.addAll '--username', 'TransferTest', '--width', '1280', '--height', '720'
        if (phase == 'verify') run.programArguments.addAll '--quickPlaySingleplayer', 'collection_m3_transfers_20260919'
    }
    tasks.register('verifyCollectionTransferLifecycle') {
        doLast {
            def failure = new File(transferDir, 'collection-lifecycle-failure.txt')
            if (failure.exists()) throw new GradleException(failure.text)
            def phases = phase == 'seed' ? ['seed', 'rejoin'] : ['verify']
            phases.each { name ->
                def evidence = new File(transferDir, "lifecycle-evidence/$name")
                def report = new groovy.json.JsonSlurper().parse(new File(evidence, 'report.json'))
                if (report.status != 'PASS' || !report.finishedAt) throw new GradleException('Incomplete transfer lifecycle evidence')
                logger.lifecycle("Transfer lifecycle $name: ${report.totals.checks - report.totals.checksFailed}/${report.totals.checks} checks")
            }
        }
    }
    tasks.matching { it.name == 'runClient' }.configureEach { finalizedBy 'verifyCollectionTransferLifecycle' }
}

// Retained-world phases deliberately use the interactive runner, never its fresh-world mode.
if (project.hasProperty('collectionLifecycle')) {
    def phase = project.property('collectionLifecycle').toString()
    if (!(phase in ['seed', 'verify']) || ldTestEnabled) {
        throw new GradleException('collectionLifecycle requires seed|verify and cannot use ldTest')
    }
    neoForge.runs.matching { it.name == 'client' }.configureEach { run ->
        run.gameDirectory = project.file('run-collection-lifecycle')
        run.systemProperty 'duelcraft.uitest.collectionLifecycle', phase
        run.programArgument '--username'
        run.programArgument 'CollectionTest'
        run.programArgument '--width'
        run.programArgument '1280'
        run.programArgument '--height'
        run.programArgument '720'
        if (phase == 'verify') {
            run.programArgument '--quickPlaySingleplayer'
            run.programArgument 'collection_m2_retained_20260917'
        }
    }
}

if (project.hasProperty('ldTest')) {
    // System properties rather than program arguments: Minecraft's argument parser owns the
    // command line and rejects what it does not recognise.
    neoForge.runs.matching { it.name == 'client' }.configureEach { run ->
        if (project.hasProperty('collectionTransferUi')) run.gameDirectory = project.file('run-collection-m3-ui')
        run.systemProperty 'ldlib2.uitest.run', project.property('ldTest')
        run.systemProperty 'ldlib2.uitest.out', ldTestOutDir
        run.systemProperty 'ldlib2.uitest.exclude', project.findProperty('ldTestExclude') ?: ''
        // Run-wide default; scenarios override it via ScenarioOptions#guiScale.
        run.systemProperty 'ldlib2.uitest.guiScale', project.findProperty('ldTestGuiScale') ?: '2'
        // Empty = maximise. Pass e.g. -PldTestWindow=1280x720 to pin a size for comparable captures.
        run.systemProperty 'ldlib2.uitest.window', project.findProperty('ldTestWindow') ?: ''
        run.systemProperty 'ldlib2.uitest.inputMode', project.findProperty('ldTestInputMode') ?: 'SYNTHETIC'
        run.systemProperty 'ldlib2.uitest.watchdogSec', project.findProperty('ldTestWatchdogSec') ?: '90'
        if (project.hasProperty('ldTestKeepOpen')) {
            run.systemProperty 'ldlib2.uitest.keepOpen', 'true'
        }
    }
}

// Turns report.json into a build failure. Attached with finalizedBy so it runs even when the
// client crashes; a missing report is itself a failure.
tasks.register('verifyUiTest') {
    group = 'verification'
    description = 'Fails the build if the LDLib2 in-client UI test report contains failures.'
    onlyIf { ldTestEnabled }
    doLast {
        def reportFile = new File(ldTestOutDirFile, 'report.json')
        if (!reportFile.exists()) {
            throw new GradleException("LDLib2 UI test: no report at ${reportFile}.\n" +
                    "The client crashed, never reached the runner, or -PldTest matched no scenarios.")
        }
        def report = new groovy.json.JsonSlurper().parse(reportFile)
        logger.lifecycle("LDLib2 UI test: ${report.totals.passed}/${report.totals.scenarios} scenarios passed, " +
                "${report.totals.checks - report.totals.checksFailed}/${report.totals.checks} checks passed " +
                "in ${report.durationMs} ms")
        report.scenarios.findAll { it.status != 'PASS' }.each { scenario ->
            logger.error("FAILED scenario '${scenario.name}' (${scenario.className})")
            if (scenario.error) logger.error("  ${scenario.error.type}: ${scenario.error.message}")
            scenario.steps.findAll { it.status != 'PASS' }.each { step ->
                logger.error("  step ${step.index} [${step.kind}] ${step.name} -> ${step.status}")
                if (step.error) logger.error("    error: ${step.error.message}")
                step.checks.findAll { !it.passed }.each { check ->
                    logger.error("    check '${check.desc}'" +
                            (check.expected != null ? " expected=${check.expected} actual=${check.actual}" : ""))
                }
                step.captures.each { logger.error("    shot: ${new File(ldTestOutDirFile, it.path)}") }
            }
        }
        if (report.status != 'PASS') {
            throw new GradleException("LDLib2 UI test ${report.status} - full report: ${reportFile}")
        }
    }
}

// Clears the previous run's output so a client that dies before the runner starts cannot be
// reported with the previous run's verdict.
tasks.register('ldlib2CleanUiTestReport') {
    onlyIf { ldTestEnabled }
    doLast { ldTestOutDirFile.deleteDir() }
}

// ModDevGradle creates the run tasks after this script is evaluated, so match runClient lazily.
tasks.configureEach { task ->
    if (task.name == 'runClient') {
        task.finalizedBy 'verifyUiTest'
        task.dependsOn 'ldlib2CleanUiTestReport'
    }
}

// Policy follow-up reuses the retained-world launcher with a separate, never-reseeded save.
if (project.hasProperty('collectionPolicyLifecycle')) {
    def phase = project.property('collectionPolicyLifecycle').toString()
    if (!(phase in ['default', 'ownership', 'restricted', 'removed']) || ldTestEnabled || project.hasProperty('collectionLifecycle')) {
        throw new GradleException('collectionPolicyLifecycle requires default|ownership|restricted|removed alone')
    }
    def policyDir = project.file('run-collection-policy-lifecycle')
    neoForge.runs.matching { it.name == 'client' }.configureEach { run ->
        run.gameDirectory = policyDir
        run.systemProperty 'duelcraft.uitest.collectionPolicyLifecycle', phase
        run.systemProperty 'duelcraft.uitest.lifecycleDirectory', policyDir.absolutePath
        run.programArguments.addAll '--username', 'PolicyTest', '--width', '1280', '--height', '720'
        if (phase != 'default') run.programArguments.addAll '--quickPlaySingleplayer', 'collection_policy_followup_20260919'
    }
    tasks.register('verifyCollectionPolicyLifecycle') {
        doLast {
            def failure = new File(policyDir, 'collection-lifecycle-failure.txt')
            if (failure.exists()) throw new GradleException(failure.text)
            def evidence = new File(policyDir, "lifecycle-evidence/$phase")
            def report = new groovy.json.JsonSlurper().parse(new File(evidence, 'report.json'))
            def manifest = new groovy.json.JsonSlurper().parse(new File(evidence, 'collection-phase.json'))
            if (report.status != 'PASS' || !report.finishedAt || manifest.phase != phase) throw new GradleException('Incomplete policy lifecycle evidence')
            logger.lifecycle("Policy lifecycle $phase: ${report.totals.checks - report.totals.checksFailed}/${report.totals.checks} checks")
        }
    }
    tasks.matching { it.name == 'runClient' }.configureEach { finalizedBy 'verifyCollectionPolicyLifecycle' }
}

def policyLifecycleDir = project.file('run-collection-policy-lifecycle').toPath().toAbsolutePath().normalize()
tasks.register('prepareCollectionPolicyOwnershipRequired') {
    doLast {
        if (policyLifecycleDir.fileName.toString() != 'run-collection-policy-lifecycle') throw new GradleException('Unexpected policy directory')
        def manifest = new groovy.json.JsonSlurper().parse(policyLifecycleDir.resolve('collection-phase.json').toFile())
        def report = new groovy.json.JsonSlurper().parse(policyLifecycleDir.resolve('lifecycle-evidence/default/report.json').toFile())
        if (manifest.phase != 'default' || manifest.world != 'collection_policy_followup_20260919' || report.status != 'PASS'
                || ProcessHandle.of(manifest.pid as long).map { it.isAlive() }.orElse(false)) throw new GradleException('Requires passed default stage and stopped JVM')
        def config = policyLifecycleDir.resolve('config/duelcraft-server.toml').toFile()
        def original = config.text
        if (!original.contains('[ownership]') || original.count('requireCardOwnership = false') != 1) throw new GradleException('Unexpected generated SERVER config')
        config.text = original.replace('requireCardOwnership = false', 'requireCardOwnership = true')
    }
}
