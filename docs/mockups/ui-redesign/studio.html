<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duelcraft • Studio concept</title>
<style>
:root{color-scheme:dark;font:15px/1.4 'Segoe UI',sans-serif;color:#e9edf3;background:#101319;--bg:#171c24;--surface:#222a35;--line:#384454;--muted:#aab7c8;--blue:#a7c9ff}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:5px;padding:8px 14px;min-height:36px;white-space:nowrap}button:hover{background:#303d4e}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #bcd6ff;outline-offset:3px}button.primary{background:var(--blue);color:#142339;border-color:var(--blue);font-weight:600}button.active{background:#34465e;border-color:#8cb8f5}button.quiet{border-color:transparent}input,select{border:1px solid var(--line);border-radius:4px;background:#111821;padding:8px 10px;min-height:36px;min-width:0}input::placeholder{color:#9aaabe}h1,h2,h3,p{margin:0}h1{font-size:32px;font-weight:600;letter-spacing:-.6px}h2{font-size:20px;font-weight:600}h3{font-size:16px;font-weight:600}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:10px}.spread{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:16px}.small{font-size:13px}.grow{flex:1}.pill{padding:3px 8px;background:#2d493f;color:#bce6ce;border-radius:4px;font-size:13px}#frame{position:absolute;width:1280px;height:720px;transform-origin:top left;background:var(--bg);overflow:hidden}header{height:64px;display:flex;align-items:center;gap:30px;padding:0 24px;border-bottom:1px solid var(--line);position:relative;z-index:2;background:#171c24}header strong{letter-spacing:.5px;font-size:20px}nav{display:flex;gap:6px}nav button{border-color:transparent}nav .current{border-bottom:2px solid var(--blue);border-radius:0}header .user{margin-left:auto;color:var(--muted)}#content{height:656px;position:relative}.home{height:100%;padding:76px 54px;position:relative;isolation:isolate}.hero{position:absolute;inset:0 0 0 auto;width:820px;height:100%;object-fit:cover;z-index:-2}.home:after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#171c24 28%,#171c24ed 39%,#171c2400 78%),linear-gradient(0deg,#171c24aa,transparent 40%)}.home h1{font-size:54px;line-height:1.1}.home-menu{width:330px;margin-top:32px;gap:12px}.home-menu button{text-align:left;font-size:21px;min-height:58px}.home-deck{margin-top:38px;border-top:1px solid var(--line);width:330px;padding-top:20px}.home-deck .name{margin-top:6px;font-size:21px}.page{padding:28px 32px}.page-title{margin-bottom:22px}.lobby-summary{padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px}.deck-thumb{width:42px;height:60px;object-fit:cover}.lobby-grid{display:grid;grid-template-columns:1fr 350px;gap:42px}.roster{margin-top:20px}.player-row{display:flex;align-items:center;gap:14px;padding:17px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;border-radius:0}.player-row.active{background:#26364a;padding-left:12px;border:1px solid #83b1f1}.avatar{width:40px;height:40px;display:grid;place-items:center;background:#3a485a;color:#d4e6ff;font-weight:600}.rules{border-left:1px solid var(--line);padding-left:28px}.rules dl{margin:18px 0 24px}.rules dt{color:var(--muted)}.rules dd{margin:0;font-size:17px}.rule-row{display:flex;justify-content:space-between;padding:10px 0}.invite-footer{margin-top:22px;justify-content:flex-end}.invite-footer button{min-width:160px}.waiting{padding:42px 0}.waiting h2{font-size:28px;margin-bottom:12px}
.collection{padding:16px 20px;height:100%}.collection-head{height:68px;display:flex;align-items:flex-start;justify-content:space-between}.collection-head input{font-size:21px;width:210px;background:none;border-color:transparent;padding-left:0;font-weight:600}.collection-head .tools{padding-top:6px}.columns{display:grid;grid-template-columns:216px 598px 394px;gap:16px;height:550px}.inspector{border-right:1px solid var(--line);padding-right:16px;min-height:0;overflow:auto}.large-card{display:block;width:140px;height:200px;object-fit:contain;margin:0 auto 12px}.inspector h2{font-size:18px;line-height:1.25;margin-bottom:8px}.card-copy{font-size:14px;margin-top:10px}.counts{display:grid;grid-template-columns:1fr 1fr;margin:14px 0;gap:6px;font-size:13px;color:var(--muted)}.inspector .row{gap:6px}.inspector button{font-size:13px;padding:6px 8px}.inspector .selected-section{background:#34465e}.deck-area{min-width:0;overflow:auto;padding-right:4px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.section-head h3 span{color:var(--muted);font-weight:400;margin-left:8px}.deck-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.card{padding:0;border:0;background:none;min-height:0;border-radius:0;position:relative;display:block}.card img{display:block;width:100%;height:auto}.card:hover{outline:2px solid var(--blue);z-index:1}.deck-grid .card{height:70px;overflow:hidden}.deck-grid .card img{height:70px;object-fit:contain}.section-minor{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.empty-section{padding:10px 0;color:var(--muted);font-size:13px}.side-grid{display:flex;gap:6px}.side-grid .card{width:42px}.browser{border-left:1px solid var(--line);padding-left:16px;display:flex;flex-direction:column;gap:10px;min-height:0}.browser-search{display:flex;gap:8px}.browser-search input{width:100%}.browser .row select{width:50%}.browser-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:140px;gap:10px;overflow:auto;align-content:start;padding:3px}.browser-grid .card small{display:block;color:var(--muted);font-size:11px;padding:3px 0}.browser-grid .card img{height:114px;object-fit:cover}.browser-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}.browser-foot button{font-size:12px;padding:6px}
.duel{height:100%;display:grid;grid-template-columns:214px 756px 246px;gap:12px;padding:14px 20px}.duel .inspector{padding-top:10px}.duel .large-card{width:154px;height:220px}.board{display:flex;flex-direction:column;min-height:0}.life{display:flex;justify-content:space-between;align-items:center;height:42px;border-bottom:2px solid #657d9c}.life strong{font-size:23px}.life.self{border-color:#a7c9ff}.field{flex:1;position:relative;background:#1c2632;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;padding:8px}.zone-row{display:flex;gap:10px;justify-content:center;align-items:center}.slot{width:66px;height:84px;border:1px solid #435365;border-radius:3px;display:flex;align-items:center;justify-content:center;position:relative;color:#8fa0b3;font-size:11px}.slot .card{height:80px;width:56px}.slot img{height:80px;object-fit:contain}.slot.facedown{background:#293140}.slot small{position:absolute;bottom:2px;left:3px;background:#101824da;padding:0 2px;color:#fff}.field-spell{position:absolute;width:42px;height:48px;border:1px solid #435365;display:grid;place-items:center;font-size:11px;color:#aab7c8}.middle-row{height:50px;display:flex;gap:108px;align-items:center;justify-content:center}.middle-slot{width:44px;height:48px;border:1px solid #435365}.phase{position:absolute;left:50%;transform:translateX(-50%);top:calc(50% - 16px);background:#34465e;padding:6px 10px;font-size:12px}.hand{display:flex;justify-content:center;gap:7px;height:82px;padding-top:6px;background:#202a36}.hand .card{height:76px;width:53px}.hand img{height:76px}.board-actions{display:flex;gap:6px;justify-content:center;padding-top:10px}.board-actions button{font-size:12px;min-height:32px;padding:5px 10px}.right-column{display:flex;flex-direction:column;gap:10px;min-height:0}.panel-toggles{display:flex;gap:6px}.panel-toggles button{flex:1;font-size:12px;padding:6px}.duel-panel{border-top:1px solid var(--line);padding-top:12px;flex:1;min-height:0;overflow:auto}.duel-panel h3{margin-bottom:12px}.zone-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.log-line{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.log-line small{color:var(--muted);display:block;margin-bottom:4px}
.scrim{position:absolute;inset:0;background:#050b12b3;z-index:10;display:flex;align-items:center;justify-content:center}.dialog{width:520px;max-height:640px;background:#222a35;border:1px solid #536174;border-radius:8px;padding:24px;box-shadow:0 24px 64px #0008}.dialog header{padding:0;height:auto;background:none;border:0;margin-bottom:20px;gap:10px}.dialog header button{margin-left:auto}.dialog-content{overflow:auto;max-height:500px}.dialog-content label{display:block;margin-bottom:16px;color:var(--muted)}.dialog-content input,.dialog-content select{width:100%;margin-top:6px;color:#e9edf3}.dialog-content .row label{width:50%}.saved-list{height:300px;overflow:auto;margin-bottom:20px}.saved-row{display:flex;align-items:center;gap:12px;width:100%;border-radius:0;border-width:0 0 1px;text-align:left;padding:14px 8px}.saved-row .grow small{display:block;color:var(--muted)}.file-menu{display:flex;flex-direction:column;gap:16px}.file-menu select{margin:0}.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.filter-grid label{margin-bottom:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}#toast{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);padding:10px 18px;background:#dae8fa;color:#152237;border-radius:5px;z-index:20;box-shadow:0 4px 20px #0004;max-width:560px;text-align:center}#toast:empty{display:none}button img{pointer-events:none}
</style>
<div id="frame"><header id="top"></header><main id="content"></main><div id="overlay"></div><div id="toast" role="status"></div></div>
<script src="fixture.js"></script><script>
let priorFocus; let screen='home',picked=DC.cards[0],opponent='Alex',waiting=false,showZone=true,showLog=true,toastTimer;
const $=id=>document.getElementById(id);
const btn=(text,action,cls='')=>`<button class="${cls}" onclick="${action}">${text}</button>`;
function notify(text){$('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',2600)}
function cards(items,extra=''){return items.map(c=>`<button class="card" onclick="inspect(${c.code})" title="${c.name}">${DC.image(c)}${extra}</button>`).join('')}
function inspect(code){picked=DC.cards.find(c=>c.code===code);document.querySelectorAll('.inspector').forEach(e=>e.innerHTML=inspector());}
function inspector(){return `${DC.image(picked,'large-card')}<h2>${picked.name}</h2><p class="small muted">${picked.code===89631139?'LIGHT / Level 8 / Dragon':'Card details'}</p><p class="card-copy">${picked.code===89631139?'This legendary dragon is a powerful engine of destruction.':'Select cards to compare them here.'}</p>${picked.code===89631139?'<p class="card-copy">ATK 3000 <span class="muted">/</span> DEF 2500</p>':''}${screen==='collection'?`<div class="counts"><span>In collection <b>3</b></span><span>In list <b>${DC.main.filter(c=>c.code===picked.code).length+(picked.code===89631139?2:0)}</b></span><span>Carried <b>0</b></span></div><div class="row">${btn('Deck',"route(this)",'selected-section')}${btn('Side',"route(this)")}</div><div class="row" style="margin-top:8px">${btn('+ Add',"notify('Prototype: copy limit reached')")}${btn('− Remove',"notify('Prototype: remove a copy from this list')")}</div><div class="row" style="margin-top:8px">${btn('Deposit',"notify('Prototype: no carried copies')")}${btn('Withdraw',"notify('Prototype: withdraw selected card')")}</div>`:''}`}
function route(b){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('selected-section',x===b));}
function showScreen(name){screen=name;closeDialog();$('toast').textContent='';$('top').innerHTML=`<strong>Duelcraft</strong><nav>${['home','collection','lobby'].map(s=>btn(s==='collection'?'My Collection':s==='lobby'?'Duel':'Home',`showScreen('${s}')`,screen===s?'current':'')).join('')}</nav><span class="user">Doc Seven</span>${btn('?',"help()",'quiet')}${btn('Close',"closeScreen()",'quiet')}`;$('content').innerHTML=({home:home,lobby:lobby,collection:collection,duel:duel}[screen]||home)();DC.fit();}
function closeScreen(){if(screen==='home')notify('Prototype: return to Minecraft');else if(screen==='duel')dialog('Leave duel?',`<p>Leaving will concede this duel.</p><div class="dialog-actions">${btn('Stay','closeDialog()')}${btn('Concede',"showScreen('home')")}</div>`);else showScreen('home');}
function home(){return `<section class="home"><img class="hero" src="${DC.art}" alt="Blue-Eyes White Dragon"><h1>Duelcraft</h1><div class="stack home-menu">${btn('Duel',"showScreen('lobby')",'primary')}${btn('My Collection',"showScreen('collection')")}</div><div class="home-deck"><p class="small muted">Active deck</p><p class="name">Dragon study</p><p class="small muted">Main 40 / Extra 0 / Side 2</p></div><div class="row" style="margin-top:28px">${btn('Help','help()','quiet')}${btn('Settings','settings()','quiet')}</div></section>`;}
function lobby(){return `<section class="page"><div class="page-title"><h1>Duel</h1></div><div class="lobby-summary row">${DC.image(DC.cards[0],'deck-thumb')}<div class="grow"><h2>Dragon study</h2><p class="muted small">Main 40 / Extra 0 / Side 2</p></div><span class="pill">Active deck</span>${btn('Change deck',"showScreen('collection')")}</div><div class="lobby-grid"><div>${waiting?`<div class="waiting"><h2>Waiting for ${opponent}</h2><p class="muted">Invitation sent.</p><div style="margin-top:24px">${btn('Cancel invitation','waiting=false;showScreen(\'lobby\')')}</div></div>`:`<div class="row spread"><h2>Choose an opponent</h2><span class="muted small">3 players online</span></div><div class="roster">${DC.players.map((p,i)=>`<button class="player-row ${opponent===p?'active':''}" onclick="opponent='${p}';showScreen('lobby')"><span class="avatar">${p[0]}</span><span class="grow">${p}</span><span class="small muted">Available</span></button>`).join('')}</div><div class="row invite-footer">${btn(`Invite ${opponent}`,"waiting=true;showScreen('lobby')",'primary')}</div>`}</div><aside class="rules"><h2>Duel settings</h2><dl>${[['Rule preset','Master Rule 5'],['Starting LP','8,000'],['Starting hand','5'],['Draw per turn','1']].map(([k,v])=>`<div class="rule-row"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>${btn('Edit settings','settings()')}</aside></div></section>`;}
function collection(){return `<section class="collection"><div class="collection-head"><div class="row"><input aria-label="Deck name" value="Dragon study"><span class="pill">Active</span></div><div class="row tools">${btn('New deck',"notify('Prototype: new unsaved list')")}${btn('My decks','decks()')}${btn('Import / export','files()')}${btn('Save',"notify('Prototype: deck saved')",'primary')}${btn('Use for duels',"notify('Prototype: this saved list is already active')")}</div></div><div class="columns"><aside class="inspector">${inspector()}</aside><section class="deck-area"><div class="section-head"><h3>Main <span>40 cards</span></h3>${btn('Sort',"notify('Prototype: grouped by card type and passcode')",'quiet')}</div><div class="deck-grid">${cards(DC.main)}</div><div class="section-minor"><div class="section-head"><h3>Extra <span>0 / 15</span></h3></div><p class="empty-section">No Extra Deck cards</p></div><div class="section-minor"><div class="section-head"><h3>Side <span>2 / 15</span></h3></div><div class="side-grid">${cards([DC.cards[0],DC.cards[0]])}</div></div></section><aside class="browser"><h3>Card browser</h3><div class="browser-search"><input aria-label="Search cards" placeholder="Name, text or passcode" oninput="searchCards(this.value)">${btn('Filters','filters()')}</div><div class="row"><select aria-label="Ownership" onchange="notify('Prototype: ownership filter selected')"><option>All cards</option><option>Owned cards</option><option>Missing cards</option><option>Extra copies</option></select><select aria-label="Card order" onchange="notify('Prototype: card order selected')"><option>Name</option><option>Attack</option><option>Defense</option><option>Passcode</option></select></div><div class="row spread small"><span class="muted" id="result-count">15 cards</span>${btn('Alternate formats: Off',"this.textContent=this.textContent.endsWith('Off')?'Alternate formats: On':'Alternate formats: Off'",'quiet')}</div><div class="browser-grid" id="browser-results">${cards(DC.cards,'<small>3 owned</small>')}</div><div class="browser-foot">${btn('Deposit carried cards',"notify('Prototype: no carried cards')")}${btn('Density',"notify('Prototype: card density control')")}</div></aside></div></section>`;}
function searchCards(query){const items=DC.cards.filter(c=>(c.name+' '+c.code).toLowerCase().includes(query.toLowerCase()));$('browser-results').innerHTML=cards(items,'<small>3 owned</small>');$('result-count').textContent=items.length+' cards';}
function slot(card,label=''){return `<div class="slot">${card?cards([card]):''}${label?`<small>${label}</small>`:''}</div>`;}
function duel(){return `<section class="duel"><aside class="inspector">${inspector()}</aside><section class="board"><div class="life"><span>Alex</span><span class="muted small">5 cards in hand</span><strong>8,000 LP</strong></div><div class="field"><div class="zone-row">${slot(null,'Deck 32')}${slot(null)}${slot(null)}<div class="slot facedown"><img style="height:80px" src="${DC.back}" alt="Opponent face-down card"></div>${slot(null)}${slot(null)}${slot(null,'GY 2')}</div><div class="zone-row">${slot(null,'Extra 0')}${slot(null)}${slot(DC.cards[0],'3000 / 2500')}${slot(null)}${slot(null)}${slot(null)}${slot(null,'Banished 0')}</div><div class="middle-row"><div class="field-spell" style="left:10px">Field</div><div class="middle-slot"></div><div class="middle-slot"></div><div class="field-spell" style="right:10px">Field</div></div><div class="phase">Turn 3 / Main 1</div><div class="zone-row">${slot(null,'Banished 0')}${slot(null)}${slot(null)}${slot(DC.cards[0],'3000 / 2500')}${slot(null)}${slot(null)}${slot(null,'Extra 0')}</div><div class="zone-row">${slot(null,'GY 3')}${slot(null)}${slot(null)}${slot(null)}${slot(null)}${slot(null)}${slot(null,'Deck 31')}</div></div><div class="life self"><span>You</span><strong>7,200 LP</strong></div><div class="hand">${cards(DC.cards.slice(0,5))}</div><div class="board-actions">${btn('Battle phase',"notify('Prototype: phase change')",'primary')}${btn('End turn',"notify('Prototype: turn ended')")}${btn('Select a card','selection()')}</div></section><aside class="right-column"><div class="panel-toggles">${btn('Zone',"showZone=!showZone;showScreen('duel')",showZone?'active':'')}${btn('Log',"showLog=!showLog;showScreen('duel')",showLog?'active':'')}</div>${showZone?`<section class="duel-panel"><div class="row spread"><h3>Your Graveyard</h3><span class="muted small">3 cards</span></div><div class="zone-cards">${cards(DC.cards.slice(1,4))}</div></section>`:''}${showLog?`<section class="duel-panel"><h3>Duel log</h3>${DC.log.map((l,i)=>`<div class="log-line"><small>${i===0?'Turn 2':'Turn 3'}</small>${l}</div>`).join('')}</section>`:''}</aside></section>`;}
function dialog(title,content){priorFocus=document.activeElement;$('overlay').innerHTML=`<div class="scrim"><section class="dialog" role="dialog" aria-label="${title}"><header><h2>${title}</h2>${btn('Close','closeDialog()')}</header><div class="dialog-content">${content}</div></section></div>`;$('overlay').querySelector('button').focus();}
function closeDialog(){$('overlay').innerHTML='';if(priorFocus?.isConnected)priorFocus.focus()}
function settings(){dialog('Duel settings',`<label>Rule preset<select size="1" aria-label="Rule preset" onchange="notify('Prototype: rule preset selected')">${['Master Rule 5','Master Rule 4','Master Rule 3','Master Rule 2','Master Rule 1','Speed Duel','GOAT','Rush Duel'].map(x=>`<option>${x}</option>`).join('')}</select></label><div class="row"><label>Starting LP<input value="8000" inputmode="numeric"></label><label>Starting hand<input value="5" inputmode="numeric"></label></div><div class="row"><label>Draw per turn<input value="1" inputmode="numeric"></label><label>Seed (optional)<input placeholder="Random"></label></div>`);}
function decks(){dialog('My decks',`<div class="saved-list">${['Dragon study','Cyberse','Spellcasters','Machines','Warriors','Ritual study','Classic cards'].map((n,i)=>`<button class="saved-row" onclick="notify('Prototype: ${n} selected');closeDialog()">${DC.image(DC.cards[i],'deck-thumb')}<span class="grow">${n}<small>Main 40 / Extra 0 / Side 2</small></span>${i===0?'<span class="pill">Active</span>':''}</button>`).join('')}</div><div class="row">${btn('Clear active',"notify('Prototype: active selection cleared')")}${btn('Duplicate',"notify('Prototype: deck duplicated')")}${btn('Delete',"notify('Prototype: confirm deletion before removing a list')")}</div>`);}
function files(){dialog('Import / export',`<div class="file-menu"><select aria-label="YDK file"><option>dragon-study.ydk</option><option>cyberse.ydk</option><option>spellcasters.ydk</option></select>${btn('Import YDK',"notify('Prototype: draft loaded from duelcraft/decks');closeDialog()",'primary')}<div style="height:1px;background:var(--line);margin:6px 0"></div>${btn('Export YDK',"notify('Prototype: dragon-study.ydk exported')")}</div>`);}
function filters(){dialog('Filter cards',`<div class="row" style="flex-wrap:wrap;margin-bottom:18px">${['Normal','Effect','Tuner','Pendulum','Fusion','Synchro','Xyz','Link'].map(x=>btn(x,"this.classList.toggle('active')")).join('')}</div><div class="filter-grid">${[['Card type',['Any','Monster','Spell','Trap','Fusion','Synchro','Xyz','Link']],['Attribute',['Any','LIGHT','DARK','EARTH','WATER','FIRE','WIND','DIVINE']],['Monster type',['Any','Dragon','Spellcaster','Warrior','Machine','Cyberse']],['Level / Rank / Link',['Any','Level','Rank','Link']]].map(([label,opts])=>`<label>${label}<select>${opts.map(x=>`<option>${x}</option>`).join('')}</select></label>`).join('')}${['Level / Rank / Link range','ATK range','DEF range','Pendulum Scale'].map(n=>`<label>${n}<div class="row"><input aria-label="${n} minimum" placeholder="Min"><input aria-label="${n} maximum" placeholder="Max"></div></label>`).join('')}</div><div class="dialog-actions">${btn('Clear all',"filters()")}${btn('Apply filters',"closeDialog();notify('Prototype: filter settings applied')",'primary')}</div>`);}
function help(){dialog('Help',`<div class="stack"><p>Right-click a browser card to add it. Right-click a deck card to remove it.</p><p>Save keeps your list. Use for duels selects your active deck.</p><p>Esc closes the current menu first.</p></div>`);}
function selection(){dialog('Choose a card',`<p class="muted" style="margin-bottom:16px">Add 1 revealed card to your hand.</p><div class="row">${DC.cards.slice(0,4).map(c=>`<button class="card" style="width:105px" onclick="closeDialog();notify('${c.name} selected')">${DC.image(c)}</button>`).join('')}</div>`);}
document.addEventListener('contextmenu',e=>{const c=e.target.closest('.card');if(c){e.preventDefault();notify(c.closest('.browser')?'Prototype: add a copy to the selected section':'Prototype: remove a copy from this list')}});
addEventListener('keydown',e=>{if(e.key==='Tab'&&$('overlay').innerHTML){const nodes=[...$('overlay').querySelectorAll('button,input,select')];const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('overlay').innerHTML)closeDialog();else closeScreen();}});
showScreen(new URLSearchParams(location.search).get('screen')||'home');
</script></html>
