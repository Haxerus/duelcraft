<style>
#dc-deck { --panel:#c6c6c6; --well:#afb0a6; --paper:#e1ded2; --ink:#262921; --accent:#566348; font:14px/1.4 'Courier New',monospace; color:var(--ink); }
#dc-deck * { box-sizing:border-box; }
#dc-deck .shell { background:var(--panel); border:3px solid #252820; box-shadow:inset 3px 3px #f8f8ee,inset -3px -3px #606557; padding:16px; }
#dc-deck h2,#dc-deck h3,#dc-deck p { margin:0; }
#dc-deck h2 { font-size:22px; line-height:1.25; }
#dc-deck h3 { font-size:14px; }
#dc-deck button,#dc-deck select,#dc-deck input { font:inherit; }
#dc-deck button { cursor:pointer; color:var(--ink); background:#b1b4a5; border:2px solid #3d4334; box-shadow:inset 2px 2px #f1f1e5,inset -2px -2px #777e69; padding:7px 9px; min-height:36px; }
#dc-deck button:hover { background:#cdd0bf; }
#dc-deck button:disabled { opacity:.55; cursor:default; }
#dc-deck button:focus-visible,#dc-deck input:focus-visible,#dc-deck select:focus-visible { outline:3px solid #825795; outline-offset:2px; }
#dc-deck .primary,#dc-deck .choices button[aria-pressed=true] { background:var(--accent); color:#ffffe9; box-shadow:inset 2px 2px #8f9c7c,inset -2px -2px #344127; }
#dc-deck .row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
#dc-deck .spread { justify-content:space-between; }
#dc-deck .small { font-size:12px; }
#dc-deck .muted { color:#55594c; }
#dc-deck .top { margin-bottom:14px; padding-bottom:12px; border-bottom:2px solid #919784; }
#dc-deck .eyebrow { font-size:11px; letter-spacing:1px; margin-bottom:4px; }
#dc-deck .private { font-size:11px; background:#e2d5e9; border-left:3px solid #806190; padding:5px 8px; color:#4f3b58; }
#dc-deck .layout { display:grid; grid-template-columns:minmax(165px,.68fr) minmax(320px,1.65fr) minmax(250px,1.08fr); gap:13px; align-items:start; }
#dc-deck .pane { min-width:0; }
#dc-deck .inspector { background:var(--paper); border:2px solid; border-color:#f7f5e9 #858979 #858979 #f7f5e9; padding:11px; }
#dc-deck .inspector h3 { font-size:15px; margin:10px 0; overflow-wrap:anywhere; }
#dc-deck .portrait { display:block; width:min(100%,138px); height:auto; margin:auto; box-shadow:2px 3px #4c51436b; }
#dc-deck .stats { font-size:12px; padding:9px 0; border-top:1px solid #aaae9b; border-bottom:1px solid #aaae9b; }
#dc-deck .effect { margin:10px 0; font:13px/1.45 Arial,sans-serif; white-space:pre-line; overflow-wrap:anywhere; }
#dc-deck .fact { display:flex; justify-content:space-between; gap:6px; font-size:12px; margin:5px 0; }
#dc-deck .editbuttons { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:10px; }
#dc-deck .editbuttons button { font-size:17px; }
#dc-deck .warning { color:#71501d; background:#efe0ac; border-left:3px solid #a87928; padding:7px 9px; font-size:12px; margin-top:9px; }
#dc-deck .section { background:var(--well); border:2px solid; border-color:#6b725e #e7eada #e7eada #6b725e; margin-bottom:12px; }
#dc-deck .sectionhead { background:#c2c8b4; border-bottom:1px solid #7a826a; padding:8px; display:flex; justify-content:space-between; align-items:center; gap:7px; flex-wrap:wrap; }
#dc-deck .sectionhead .small { color:#4c5441; }
#dc-deck .deckgrid { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:5px; padding:9px; align-content:start; }
#dc-deck .deckgrid:empty { min-height:65px; }
#dc-deck .sideempty { padding:18px 10px; font-size:12px; text-align:center; color:#505748; }
#dc-deck .thumb { position:relative; padding:0; min-width:0; min-height:0; border:0; box-shadow:0 1px 2px #313b24; background:#7d8471; display:block; line-height:0; }
#dc-deck .thumb img { display:block; width:100%; aspect-ratio:0.686; object-fit:cover; }
#dc-deck .thumb[aria-pressed=true] { outline:2px solid #7a4b99; outline-offset:1px; z-index:1; }
#dc-deck .thumb.missing img { opacity:.43; }
#dc-deck .missingmark { position:absolute; bottom:3px; left:3px; right:3px; background:#f3d277; color:#473512; line-height:1.2; font:11px/1.2 Arial,sans-serif; padding:2px; text-align:center; }
#dc-deck .collection { border-left:2px solid #959b89; padding-left:12px; }
#dc-deck label { display:grid; gap:4px; font-size:11px; }
#dc-deck input,#dc-deck select { width:100%; min-width:0; border:2px solid; border-color:#646d58 #f4f5e9 #f4f5e9 #646d58; background:#eeeee2; color:var(--ink); padding:7px; min-height:36px; font-size:12px; }
#dc-deck .collection h3 { margin-bottom:10px; }
#dc-deck .searchrow { display:grid; grid-template-columns:1fr auto; gap:6px; margin:8px 0; align-items:end; }
#dc-deck .searchrow button { font-size:12px; }
#dc-deck .fields { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:8px 0; }
#dc-deck .catalogue { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px 7px; margin-top:10px; }
#dc-deck .catalogue .tile { min-width:0; }
#dc-deck .catalogue .thumb { width:100%; }
#dc-deck .tilecaption { display:flex; justify-content:space-between; gap:3px; padding-top:5px; font-size:11px; }
#dc-deck .chips { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; }
#dc-deck .chips button { padding:3px 6px; min-height:25px; font-size:11px; background:#e0dbc5; border:1px solid #8b846b; box-shadow:none; }
#dc-deck .group { border-top:1px solid #979e89; padding-top:9px; margin-top:9px; }
#dc-deck .group h3 { font-size:12px; margin-bottom:6px; }
#dc-deck .choices { display:flex; flex-wrap:wrap; gap:5px; }
#dc-deck .choices button { padding:4px 6px; min-height:30px; font-size:11px; }
#dc-deck .filterpane { background:#d7d9cb; border:2px inset #e6e9da; padding:10px; margin-top:9px; }
#dc-deck .filterpane details { margin-top:10px; }
#dc-deck summary { cursor:pointer; font-size:12px; padding:5px 0; }
#dc-deck .pagination { margin-top:12px; }
#dc-deck .pagination button { font-size:12px; }
#dc-deck .footer { border-top:2px solid #939a84; padding-top:11px; margin-top:12px; }
#dc-deck .notice { font-size:12px; min-height:18px; margin-top:10px; }
#dc-deck .empty { padding:25px 8px; text-align:center; font-size:12px; }
#dc-deck .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
#dc-deck [hidden] { display:none!important; }
#dc-deck[data-cards=large] .deckgrid { grid-template-columns:repeat(6,minmax(0,1fr)); }
#dc-deck .viewport { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:#262b22; }
#dc-deck .shell { position:absolute; inset:0 auto auto 0; width:1280px; height:720px; padding:12px; transform-origin:0 0; display:grid; grid-template-rows:56px minmax(0,1fr)36px 18px; gap:8px; overflow:hidden; }
#dc-deck .top { margin:0; padding:0 0 7px; }
#dc-deck .top .eyebrow { margin:0; }
#dc-deck .layout { height:100%; min-height:0; grid-template-columns:224px minmax(0,1fr)348px; gap:12px; align-items:stretch; }
#dc-deck .pane { min-height:0; height:100%; }
#dc-deck .inspector { display:flex; flex-direction:column; padding:10px; overflow:hidden; }
#dc-deck .inspect-scroll { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding-right:6px; overscroll-behavior:contain; }
#dc-deck .inspect-controls { flex:none; border-top:2px solid #a3a892; padding-top:5px; }
#dc-deck .inspect-controls .warning { margin-top:4px; padding:4px 6px; }
#dc-deck .portrait { width:118px; }
#dc-deck .inspector h3 { margin:8px 0; }
#dc-deck .effect { font-size:14px; }
#dc-deck .stats { padding:7px 0; }
#dc-deck .fact { margin:3px 0; }
#dc-deck .editbuttons { margin-top:7px; }
#dc-deck #deck-sections { display:grid; height:100%; min-height:0; grid-template-rows:minmax(0,1fr) var(--extra-pane-height,128px) 32px; gap:8px; }
#dc-deck[data-side-open=true] #deck-sections { grid-template-rows:minmax(0,1fr) var(--extra-pane-height,128px) 150px; }
#dc-deck[data-cards=large] { --extra-pane-height:150px; }
#dc-deck .section { margin:0; min-height:0; display:grid; grid-template-rows:28px minmax(0,1fr); overflow:hidden; }
#dc-deck .sectionhead { padding:3px 8px; height:28px; flex-wrap:nowrap; }
#dc-deck .sectionhead button { font-size:11px; min-height:22px; padding:1px 6px; }
#dc-deck .deckgrid { min-height:0; height:100%; overflow-y:auto; overflow-x:hidden; grid-template-columns:repeat(10,minmax(0,1fr)); grid-auto-rows:79px; gap:4px; padding:6px; justify-items:center; overscroll-behavior:contain; scrollbar-gutter:stable; }
#dc-deck .deckgrid .thumb { width:100%; max-width:54px; align-self:start; }
#dc-deck .deckgrid:empty { min-height:0; }
#dc-deck .sideempty { min-height:0; padding:12px 8px; }
#dc-deck[data-cards=large] .deckgrid { grid-template-columns:repeat(8,minmax(0,1fr)); grid-auto-rows:103px; }
#dc-deck[data-cards=large] .deckgrid .thumb { max-width:70px; }
#dc-deck .collection { display:flex; flex-direction:column; overflow:hidden; }
#dc-deck .collection > .row,#dc-deck .collection > .searchrow,#dc-deck .collection > .fields { flex:none; }
#dc-deck .collection h3 { margin:0; }
#dc-deck .searchrow { margin:8px 0 4px; }
#dc-deck .fields { margin:5px 0; }
#dc-deck .chips { flex:none; max-height:64px; overflow-y:auto; margin:5px 0; }
#dc-deck .chips:empty { display:none; }
#dc-deck #browse-results { display:flex; flex-direction:column; flex:1; min-height:0; }
#dc-deck #browse-results > .row { flex:none; }
#dc-deck .catalogue { grid-template-columns:repeat(4,minmax(0,1fr)); align-content:start; flex:1; min-height:0; overflow:auto; margin-top:7px; padding:3px 7px 4px 3px; gap:9px 6px; overscroll-behavior:contain; scrollbar-gutter:stable; }
#dc-deck .tilecaption { font-size:12px; padding-top:4px; justify-content:center; gap:5px; }
#dc-deck .tilecaption span+span:before { content:'/ '; }
#dc-deck .filterpane { display:flex; flex-direction:column; flex:1; min-height:0; margin:6px 0 0; padding:8px; overflow:hidden; }
#dc-deck .filter-scroll { flex:1; min-height:0; overflow-y:auto; padding-right:5px; overscroll-behavior:contain; }
#dc-deck #apply-filters { flex:none; }
#dc-deck .footer { margin:0; padding:4px 0 0; flex-wrap:nowrap; }
#dc-deck .footer button { min-height:28px; padding:3px 9px; font-size:12px; }
#dc-deck .notice { margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#dc-deck .footer .row { flex-wrap:nowrap; }
#dc-deck .footer label { display:flex; align-items:center; gap:8px; }
#dc-deck .footer select { width:118px; min-height:27px; padding:3px 6px; }
#dc-deck #deck-warning { display:none; }
#dc-deck .deck-help { display:none; }
#dc-deck ::-webkit-scrollbar { width:9px; height:9px; }
#dc-deck ::-webkit-scrollbar-track { background:#969e88; }
#dc-deck ::-webkit-scrollbar-thumb { background:#dce1d0; border:2px solid #69725a; }
</style>
<div id="dc-deck" aria-label="Duelcraft deck editor, fixed 1280 by 720 design canvas">
 <div class="viewport">
 <div class="shell">
  <header class="row spread top"><div><div class="eyebrow">DUELCRAFT / DECK BUILDER</div><h2>Starter deck</h2><p class="small muted" id="deck-summary"></p></div><div class="row"><span class="private">Your personal collection</span><button type="button" class="primary" id="save-deck">Save deck</button></div></header>
  <div class="layout">
   <aside class="pane inspector" id="card-inspector" aria-label="Selected card details"></aside>
   <section class="pane" aria-label="Deck contents">
    <div id="deck-sections"></div>
    <p class="small muted deck-help">Select a card to inspect · +1 / −1 to edit</p>
    <div id="deck-warning"></div>
   </section>
   <section class="pane collection" aria-label="Collection browser">
    <div class="row spread"><h3>Card collection</h3><span class="small" id="collection-total"></span></div>
    <div class="searchrow"><label>Search<input id="card-search" type="search" placeholder="Name, text, passcode…" autocomplete="off"></label><button type="button" id="toggle-filters" aria-expanded="false" aria-controls="filter-pane">Filters</button></div>
    <div class="fields"><label>Show<select id="collection-view"><option value="owned">Owned cards</option><option value="all">All cards</option><option value="missing">Missing for deck</option><option value="extras">Copies above 3</option></select></label><label>Sort<select id="card-sort"><option value="name">Name A–Z</option><option value="owned">Most copies</option><option value="atk">Highest ATK</option></select></label></div>
    <div class="chips" id="active-filters"></div>
    <div id="filter-pane" class="filterpane" hidden>
     <div class="row spread"><h3>Filter cards</h3><button type="button" data-clear="all">Clear</button></div>
     <div class="filter-scroll"><label>Search in<select id="search-scope"><option value="all">Name + card text</option><option value="name">Name only</option><option value="text">Card text only</option></select></label>
     <div id="filter-groups"></div>
     <details><summary>Numeric filters</summary>
      <label>Number type<select id="number-type"><option value="any">Level / Rank / Link</option><option>Level</option><option>Rank</option><option>Link</option></select></label>
      <div class="fields"><label>Min. number<input type="number" min="0" max="13" data-stat="minNum" placeholder="Any"></label><label>Max. number<input type="number" min="0" max="13" data-stat="maxNum" placeholder="Any"></label></div>
      <div class="fields"><label>Min. ATK<input type="number" min="0" step="100" data-stat="minAtk" placeholder="Any"></label><label>Max. ATK<input type="number" min="0" step="100" data-stat="maxAtk" placeholder="Any"></label></div>
      <div class="fields"><label>Min. DEF<input type="number" min="0" step="100" data-stat="minDef" placeholder="Any"></label><label>Max. DEF<input type="number" min="0" step="100" data-stat="maxDef" placeholder="Any"></label></div>
      <div class="fields"><label>Min. scale<input type="number" min="0" max="13" data-stat="minScale" placeholder="Any"></label><label>Max. scale<input type="number" min="0" max="13" data-stat="maxScale" placeholder="Any"></label></div>
     </details>
     </div><button type="button" class="primary" id="apply-filters" style="width:100%;margin-top:8px">Show results</button>
    </div>
    <div id="browse-results"><div class="row spread small"><span id="result-count" role="status"></span><span>Owned / used</span></div><div class="catalogue" id="collection-grid"></div><div class="row spread pagination" id="collection-pages"></div></div>
   </section>
  </div>
  <footer class="row spread footer"><span class="small muted">1280 × 720 · Sample deck / ownership</span><div class="row"><label>Card size<select id="deck-card-size"><option value="standard">Standard</option><option value="large">Large</option></select></label><button type="button" id="deposit-cards">Deposit carried cards</button></div></footer>
  <div class="notice" id="editor-notice" role="status">Deck lists use your collection directly. Editing never moves physical cards.</div>
 </div>
 </div>

<script>
(() => {
 const root=document.getElementById('dc-deck'),q=s=>root.querySelector(s);
 const cards=JSON.parse(document.getElementById('deck-card-data').textContent);
 const attrs={1:'EARTH',2:'WATER',4:'FIRE',8:'WIND',16:'LIGHT',32:'DARK',64:'DIVINE'};
 const races={1:'Warrior',2:'Spellcaster',8:'Fiend',16:'Zombie',8192:'Dragon',16777216:'Cyberse'};
 const bits={Normal:16,Effect:32,Fusion:64,Ritual:128,Tuner:4096,Synchro:8192,Xyz:8388608,Pendulum:16777216,Link:67108864,'Quick-Play':65536,Counter:1048576};
 for(const c of cards){c.kind=c.bits&1?'Monster':c.bits&2?'Spell':'Trap';c.attr=attrs[c.attribute]||'';c.race=races[c.race]||'';c.num=c.level&255;c.measure=c.bits&67108864?'Link':c.bits&8388608?'Rank':'Level';c.scale=c.bits&16777216?(c.level>>>24)&255:null;c.sub=Object.keys(bits).filter(k=>c.bits&bits[k]);c.extra=!!(c.bits&(64|8192|8388608|67108864));if(c.kind!=='Monster'&&!c.sub.length)c.sub=['Normal'];}
 const deck={main:[],extra:[],side:[]};
 cards.filter(c=>c.extra).forEach(c=>{for(let n=0;n<(c.name==='Blue-Eyes Ultimate Dragon'?3:1);n++)deck.extra.push(c.id);});
 cards.filter(c=>!c.extra).forEach((c,i)=>{for(let n=0;n<(i<5?2:3);n++)deck.main.push(c.id);});
 const state={selected:cards[0].id,zone:'main',target:'deck',query:'',scope:'all',view:'owned',sort:'name',page:0,filters:false,dirty:false,sideOpen:false,kind:[],sub:[],props:[],race:[],attr:[],measure:'any',minNum:'',maxNum:'',minAtk:'',maxAtk:'',minDef:'',maxDef:'',minScale:'',maxScale:'',cardSize:'standard'};
 let lastSelected=null;
 const groups={kind:['Card category',['Monster','Spell','Trap']],sub:['Frame / subtype · match any',['Normal','Fusion','Ritual','Synchro','Xyz','Link','Quick-Play','Counter']],props:['Properties · match all',['Effect','Tuner','Pendulum']],race:['Monster type',['Dragon','Spellcaster','Warrior','Zombie','Fiend']],attr:['Attribute',['LIGHT','DARK','FIRE','WIND','EARTH','WATER','DIVINE']]};
 const statLabels={minNum:'Number ≥',maxNum:'Number ≤',minAtk:'ATK ≥',maxAtk:'ATK ≤',minDef:'DEF ≥',maxDef:'DEF ≤',minScale:'Scale ≥',maxScale:'Scale ≤'};
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const normalize=s=>String(s).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
 const used=id=>Object.values(deck).flat().filter(v=>v===id).length;
 const fit=(n,a,b)=>a===''&&b===''||n!==null&&n>=0&&(a===''||n>=Number(a))&&(b===''||n<=Number(b));
 const notice=s=>q('#editor-notice').textContent=s;
 const autoZone=c=>state.target==='side'?'side':c.extra?'extra':'main';
 const thumb=(c,zone='',index=-1,missing=false)=>`<button type="button" class="thumb ${missing?'missing':''}" data-card="${c.id}" data-zone="${zone}" data-index="${index}" aria-label="${esc(c.name)}${zone?', '+zone+' deck copy '+(index+1):', '+c.owned+' owned, '+used(c.id)+' used'}" aria-pressed="${state.selected===c.id}" data-tooltip="${esc(c.name)}${missing?' · Missing copy':''}"><img src="${c.image}" alt="" draggable="false">${missing?'<span class="missingmark">Missing</span>':''}</button>`;
 function matches(c){
  if(state.view==='owned'&&!c.owned||state.view==='missing'&&c.owned>=used(c.id)||state.view==='extras'&&c.owned<=3)return false;
  const hay=normalize((state.scope==='name'?c.name:state.scope==='text'?c.text:c.name+' '+c.text)+' '+c.id);
  if(!normalize(state.query).split(' ').every(t=>hay.includes(t)))return false;
  for(const g of Object.keys(groups)){if(!state[g].length)continue;if(g==='props'){if(!state[g].every(v=>c.sub.includes(v)))return false;}else if(!state[g].some(v=>g==='sub'?c.sub.includes(v):c[g]===v))return false;}
  if(state.measure!=='any'&&(c.kind!=='Monster'||c.measure!==state.measure))return false;
  return fit(c.kind==='Monster'?c.num:null,state.minNum,state.maxNum)&&fit(c.kind==='Monster'?c.atk:null,state.minAtk,state.maxAtk)&&fit(c.kind==='Monster'&&c.measure!=='Link'?c.def:null,state.minDef,state.maxDef)&&fit(c.scale,state.minScale,state.maxScale);
 }
 function clear(){state.query='';state.measure='any';for(const g of Object.keys(groups))state[g]=[];for(const k of Object.keys(statLabels))state[k]='';q('#card-search').value='';q('#number-type').value='any';root.querySelectorAll('[data-stat]').forEach(i=>i.value='');state.page=0;}
 function edit(add){
  const c=cards.find(c=>c.id===state.selected),zone=autoZone(c);
  if(add){if(used(c.id)>=3){notice('Three copies already included across Main, Extra, and Side.');return;}if(deck[zone].length>=(zone==='main'?60:15)){notice('This section is full.');return;}deck[zone].push(c.id);state.zone=zone;notice(`Added ${c.name} to the ${zone} deck.`);}
  else{let z=state.zone;if(!deck[z]?.includes(c.id))z=Object.keys(deck).find(k=>deck[k].includes(c.id));if(!z)return;deck[z].splice(deck[z].lastIndexOf(c.id),1);notice(`Removed one ${c.name} from the ${z} deck.`);}
  if(zone==='side'&&add)state.sideOpen=true;
  state.dirty=true;render();
 }
 function render(){
  const scrolls=Object.fromEntries([...root.querySelectorAll('[data-scroll-zone]')].map(el=>[el.dataset.scrollZone,el.scrollTop]));
  const inspectTop=lastSelected===state.selected?(q('.inspect-scroll')?.scrollTop||0):0;
  root.dataset.cards=state.cardSize;
  root.dataset.sideOpen=String(state.sideOpen);
  q('#deck-card-size').value=state.cardSize;
  const missing=cards.reduce((sum,c)=>sum+Math.max(0,used(c.id)-c.owned),0);
  q('#deck-summary').textContent=`Main ${deck.main.length} · Extra ${deck.extra.length} · Side ${deck.side.length}${missing?' · '+missing+' missing':''}${state.dirty?' · Unsaved changes':''}`;
  q('#deck-warning').innerHTML=missing?`<div class="warning">${missing} ${missing===1?'copy':'copies'} missing from your collection. You can save this draft.</div>`:'';
  const seen={};
  q('#deck-sections').innerHTML=Object.entries(deck).map(([zone,ids])=>`<section class="section" aria-label="${zone} deck"><div class="sectionhead"><h3>${zone[0].toUpperCase()+zone.slice(1)} Deck <span class="small">${ids.length}${zone==='main'?' / 40–60':' / 15'}</span></h3>${zone==='side'?`<button type="button" id="toggle-side" aria-expanded="${state.sideOpen}">${state.sideOpen?'Collapse':'Expand'}</button>`:zone==='main'?'<span class="small">One tile per copy</span>':''}</div>${ids.length?`<div class="deckgrid" data-scroll-zone="${zone}" ${zone==='side'&&!state.sideOpen?'hidden':''}>${ids.map((id,i)=>{const c=cards.find(c=>c.id===id);seen[id]=(seen[id]||0)+1;return thumb(c,zone,i,seen[id]>c.owned);}).join('')}</div>`:`<div class="sideempty" ${zone==='side'&&!state.sideOpen?'hidden':''}>No cards · choose Side Deck when adding</div>`}</section>`).join('');
  const c=cards.find(c=>c.id===state.selected);
  q('#card-inspector').innerHTML=`<div class="inspect-scroll"><div class="eyebrow">SELECTED CARD</div><img class="portrait" src="${c.image}" alt="${esc(c.name)}"><h3>${c.name}</h3><div class="stats">${c.kind==='Monster'?`${c.race} / ${c.sub.join(' / ')}<br>${c.attr} · ${c.measure} ${c.num}<br>ATK ${c.atk<0?'?':c.atk}${c.measure==='Link'?'':` / DEF ${c.def<0?'?':c.def}`}${c.scale!==null?` · Scale ${c.scale}`:''}`:c.sub.join(' / ')+' '+c.kind}</div><p class="effect">${esc(c.text)}</p><details><summary>Physical card transfers</summary><p class="small">${c.carried} carried</p><div class="row" style="margin-top:8px"><button type="button" data-withdraw="1" ${!c.owned?'disabled':''}>Withdraw 1</button><button type="button" data-withdraw="extras" ${c.owned<=3?'disabled':''}>Above 3</button></div></details></div><div class="inspect-controls"><div class="fact"><span>In collection</span><strong>${c.owned}</strong></div><div class="fact"><span>Used in this deck</span><strong>${used(c.id)}</strong></div>${used(c.id)>c.owned?`<div class="warning">Missing ${used(c.id)-c.owned} ${used(c.id)-c.owned===1?'copy':'copies'}</div>`:''}<label for="add-target" style="margin-top:6px">Add to</label><select id="add-target"><option value="deck" ${state.target==='deck'?'selected':''}>${c.extra?'Extra':'Main'} Deck</option><option value="side" ${state.target==='side'?'selected':''}>Side Deck</option></select><div class="editbuttons"><button type="button" class="primary" data-edit="add" aria-label="Add one selected card" ${used(c.id)>=3?'disabled':''}>+1</button><button type="button" data-edit="remove" aria-label="Remove one selected card" ${!used(c.id)?'disabled':''}>−1</button></div></div>`;
  q('#filter-groups').innerHTML=Object.entries(groups).map(([g,[name,opts]])=>`<div class="group"><h3>${name}</h3><div class="choices">${opts.map(v=>`<button type="button" data-group="${g}" data-value="${v}" aria-pressed="${state[g].includes(v)}">${v}</button>`).join('')}</div></div>`).join('');
  const chips=[];
  if(state.query)chips.push(`<button type="button" data-clear="query">${esc(state.query)} ×</button>`);
  for(const g of Object.keys(groups))for(const v of state[g])chips.push(`<button type="button" data-group="${g}" data-value="${v}">${v} ×</button>`);
  if(state.measure!=='any')chips.push(`<button type="button" data-clear="measure">${state.measure} ×</button>`);
  for(const [k,label]of Object.entries(statLabels))if(state[k]!=='')chips.push(`<button type="button" data-clear="${k}">${label} ${state[k]} ×</button>`);
  q('#active-filters').innerHTML=chips.join('');
  q('#filter-pane').hidden=!state.filters;q('#browse-results').hidden=state.filters;q('#toggle-filters').setAttribute('aria-expanded',String(state.filters));
  q('#toggle-filters').textContent=state.filters?'Close':chips.length?`Filters (${chips.length})`:'Filters';
  const results=cards.filter(matches).sort((a,b)=>state.sort==='owned'?b.owned-a.owned||a.name.localeCompare(b.name):state.sort==='atk'?(b.kind==='Monster'?b.atk:-2)-(a.kind==='Monster'?a.atk:-2)||a.name.localeCompare(b.name):a.name.localeCompare(b.name));
  q('#apply-filters').textContent=`Show ${results.length} matching cards`;
  q('#result-count').textContent=`${results.length} ${results.length===1?'result':'results'}`;
  q('#collection-grid').innerHTML=results.map(c=>`<div class="tile">${thumb(c)}<div class="tilecaption" aria-label="${c.owned} owned, ${used(c.id)} used"><span>${c.owned}</span><span>${used(c.id)}</span></div></div>`).join('')||'<div class="empty" style="grid-column:1/-1">No matching cards.<br><button type="button" data-clear="all" style="margin-top:10px">Clear filters</button></div>';
  q('#collection-pages').hidden=true;
  q('#collection-total').textContent=`${cards.reduce((s,c)=>s+c.owned,0)} stored`;
  root.querySelectorAll('[data-scroll-zone]').forEach(el=>el.scrollTop=scrolls[el.dataset.scrollZone]||0);
  q('.inspect-scroll').scrollTop=inspectTop;lastSelected=state.selected;
 }
 root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.card){state.selected=Number(d.card);state.zone=d.zone||autoZone(cards.find(c=>c.id===state.selected));}
  else if(d.edit){edit(d.edit==='add');return;}
  else if(d.group){state[d.group]=state[d.group].includes(d.value)?state[d.group].filter(v=>v!==d.value):[...state[d.group],d.value];state.page=0;}
  else if(d.clear){if(d.clear==='all')clear();else if(d.clear==='query'){state.query='';q('#card-search').value='';}else if(d.clear==='measure'){state.measure='any';q('#number-type').value='any';}else{state[d.clear]='';q(`[data-stat="${d.clear}"]`).value='';}state.page=0;}
  else if(d.page)state.page+=Number(d.page);
  else if(d.withdraw){const c=cards.find(c=>c.id===state.selected);const n=d.withdraw==='extras'?Math.max(0,c.owned-3):Math.min(1,c.owned);c.owned-=n;c.carried+=n;notice(`Withdrew ${n} × ${c.name}.`);}
  else if(b.id==='toggle-filters')state.filters=!state.filters;
  else if(b.id==='toggle-side')state.sideOpen=!state.sideOpen;
  else if(b.id==='apply-filters')state.filters=false;
  else if(b.id==='deposit-cards'){let n=0;for(const c of cards){n+=c.carried;c.owned+=c.carried;c.carried=0;}notice(n?`Deposited ${n} cards into your collection.`:'No carried cards to deposit.');}
  else if(b.id==='save-deck'){state.dirty=false;notice('Preview: deck list saved. Missing copies remain marked; collection ownership is unchanged.');}
  render();
 });
 q('#card-search').addEventListener('input',e=>{state.query=e.target.value;state.page=0;render();});
 for(const [id,key]of [['collection-view','view'],['card-sort','sort'],['search-scope','scope'],['number-type','measure']])q('#'+id).addEventListener('change',e=>{state[key]=e.target.value;state.page=0;render();});
 root.addEventListener('change',e=>{if(e.target.id==='add-target'){state.target=e.target.value;state.zone=autoZone(cards.find(c=>c.id===state.selected));}else if(e.target.id==='deck-card-size'){state.cardSize=e.target.value;render();}});
 root.querySelectorAll('[data-stat]').forEach(el=>el.addEventListener('input',e=>{state[e.target.dataset.stat]=e.target.value;state.page=0;render();}));
 render();
 const viewport=q('.viewport'),canvas=q('.shell');
 const fitCanvas=()=>{canvas.style.transform=`scale(${viewport.getBoundingClientRect().width/1280})`;};
 new ResizeObserver(fitCanvas).observe(viewport);fitCanvas();
 if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addSelect(state,'cardSize',{label:'Deck card size',options:['standard','large']});}
})();
</script>
